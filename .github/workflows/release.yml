# Publishes a new APK version after all push checks on main succeed.
# The TV's update check downloads that file. It is built without config.properties and signed with the
# key already on the TVs (repository secrets FREEMYTV_KEYSTORE and FREEMYTV_KEYSTORE_PASS).
name: Release

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository
    name: Publish FreeMyTV.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (build-tools 34, android-34)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Version
        id: version
        run: |
          sha=$(git rev-parse HEAD)
          latest=$(gh release view --json tagName,targetCommitish)
          target=$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["targetCommitish"])')
          if [ "$target" = "$sha" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "This commit is already released."
          else
            tag=$(printf '%s' "$latest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tagName"])')
            name=$(python3 tools/release-version.py app/AndroidManifest.xml "$tag")
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build
        if: steps.version.outputs.exists == 'false'
        env:
          FREEMYTV_KEYSTORE_B64: ${{ secrets.FREEMYTV_KEYSTORE }}
          FREEMYTV_KEYSTORE_PASS: ${{ secrets.FREEMYTV_KEYSTORE_PASS }}
        run: |
          if [ -z "$FREEMYTV_KEYSTORE_B64" ] || [ -z "$FREEMYTV_KEYSTORE_PASS" ]; then
            echo "The signing key is not in this repository's secrets, so no release was published."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$FREEMYTV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keys/freemytv.keystore"
          export FREEMYTV_KEYSTORE="$RUNNER_TEMP/keys/freemytv.keystore"
          ./build.sh --generic
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs FreeMyTV.apk \
            | grep -q 94ea93a97b298f691f232eab656ec096d2d2701b4790b7e0308912632fd45138
      - name: Publish
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.name }}" FreeMyTV.apk \
            --target "$(git rev-parse HEAD)" \
            --title "${{ steps.version.outputs.name }}" \
            --notes "Free My TV for the TVs at home. Home Settings > Updates installs this file."
